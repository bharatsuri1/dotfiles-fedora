#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

sort_order = ["tmux", "config", "zoxide"]

[tui]
show_icons = true
preview = true
preview_width = 60
preview_border = "line"

[default_session]
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "home"
path = "~"
disable_startup_command = true

# Terminal-based system control panel.
# A single window with four split panes for Wi-Fi, Bluetooth, audio, and
# system monitoring.  See docs/system-control-panel.md for details.
[[session]]
name = "control-panel"
path = "~"
startup_command = "~/.config/sesh/scripts/control-panel.sh"
