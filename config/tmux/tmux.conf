# Use an ergonomic prefix that does not overlap common shell shortcuts.
set-option -g prefix C-Space
bind-key C-Space switch-client -T root

# Terminal capabilities and interaction.
set-option -g mouse on
set-option -g default-terminal "tmux-256color"
set-option -ag terminal-features ",*:RGB:extkeys"
set-option -g extended-keys on
set-option -g history-limit 100000
set-option -s escape-time 10
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g detach-on-destroy off
set-window-option -g mode-keys vi
set-option -s set-clipboard off

# Keep visual configuration isolated from interaction and behavior.
source-file -q "~/.config/tmux/status.conf"

# Create windows and panes in the active pane's working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Navigate and resize panes with repeatable Vim-style keys.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Kill the active pane immediately.
bind-key x kill-pane

# Reload this configuration and confirm success in the status line.
bind-key r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux configuration reloaded"

# Open Sesh's built-in session picker in a popup.
bind-key k display-popup -E -w 80% -h 90% "/home/linuxbrew/.linuxbrew/bin/sesh picker"
bind-key Tab run-shell "/home/linuxbrew/.linuxbrew/bin/sesh last"

# Trial: fzf-powered sesh picker (source filters, kill with ^d, find with ^f).
# Absolute sesh path: the tmux server's PATH lacks /home/linuxbrew. fzf/fd are /usr/bin.
# NOTE: overrides resize-pane -U (prefix+K) while this trial lasts.
bind-key K run-shell "/home/linuxbrew/.linuxbrew/bin/sesh connect \"$(
  /home/linuxbrew/.linuxbrew/bin/sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(/home/linuxbrew/.linuxbrew/bin/sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(/home/linuxbrew/.linuxbrew/bin/sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(/home/linuxbrew/.linuxbrew/bin/sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(/home/linuxbrew/.linuxbrew/bin/sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(/home/linuxbrew/.linuxbrew/bin/sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview '/home/linuxbrew/.linuxbrew/bin/sesh preview {}'
)\""

# Use Vim-style selection and copy directly to the Wayland clipboard.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
