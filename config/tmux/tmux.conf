# Use an ergonomic prefix that does not overlap common shell shortcuts.
set-option -g prefix C-Space
bind-key C-Space switch-client -T root

# Terminal capabilities and interaction.
set-option -g mouse on
set-option -g default-terminal "tmux-256color"
set-option -ag terminal-features ",*:RGB:extkeys"
set-option -g extended-keys always
set-option -g extended-keys-format csi-u
set-option -g history-limit 100000
set-option -s escape-time 10
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g detach-on-destroy off
set-window-option -g mode-keys vi
set-option -s set-clipboard off

# Preserve Shift+Enter for TUIs that use the CSI-u multiline sequence.
bind-key -n S-Enter send-keys Escape "[13;2u"

# Keep visual configuration isolated from interaction and behavior.
source-file -q "~/.config/tmux/status.conf"

# Create windows and panes in the active pane's working directory.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Navigate and resize panes with repeatable Vim-style keys.
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Kill the active pane immediately.
bind-key x kill-pane

# Reload this configuration and confirm success in the status line.
bind-key r source-file "~/.config/tmux/tmux.conf" \; display-message "tmux configuration reloaded"

# Sesh lives in the Homebrew prefix, which the tmux server's PATH does not
# include (the server inherits the environment of the process that started
# it, not the interactive shell). Publish the absolute path once as a
# server-global environment variable; run-shell, display-popup, and the
# fzf child shells below all inherit it, so every binding references
# the variable instead of a repeated hardcoded path. The bindings escape
# the dollar sign because tmux expands unescaped $VARIABLES in double-quoted
# configuration strings at parse time, from the server process environment,
# where SESH_BIN does not exist.
set-environment -g SESH_BIN "/home/linuxbrew/.linuxbrew/bin/sesh"

# Open Sesh's built-in session picker in a popup.
bind-key b display-popup -E -w 80% -h 90% "\$SESH_BIN picker"
bind-key Tab run-shell "\$SESH_BIN last"

# Trial: fzf-powered sesh picker (source filters, kill with ^d, find with ^f).
# fzf and fd resolve from /usr/bin, so bare names work inside the pipeline.
bind-key B run-shell "\$SESH_BIN connect \"$(
  \$SESH_BIN list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(\$SESH_BIN list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(\$SESH_BIN list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(\$SESH_BIN list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(\$SESH_BIN list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(\$SESH_BIN list --icons)' \
    --preview-window 'right:55%' \
    --preview '\$SESH_BIN preview {}'
)\""

# Prefix-free Alt shortcuts (Alacritty sends Alt as Meta).
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R
bind-key -n M-n next-window
bind-key -n M-p previous-window
bind-key -n M-s display-popup -E -w 80% -h 90% "\$SESH_BIN picker"
bind-key -n M-o run-shell "\$SESH_BIN last"
bind-key -n M-c new-window -c "#{pane_current_path}"
bind-key -n 'M-\' split-window -h -c "#{pane_current_path}"
bind-key -n M-- split-window -v -c "#{pane_current_path}"

# Use Vim-style selection and copy directly to the Wayland clipboard.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
