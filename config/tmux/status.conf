# Vesper status bar with a transparent row and an active-window pill.
set-option -g status-position top
set-option -g status 2
set-option -g status-style "bg=default,fg=#a0a0a0"
set-option -g 'status-format[1]' ""
set-option -g status-left-length 8
set-option -g status-right-length 40
set-option -g status-right "󰍹 #{=/32/...:session_name}"
set-option -g window-status-separator " "

# Mint while idle; love while the prefix is active.
set-option -g status-left "#[fg=#{?client_prefix,#eb6f92,#99ffe4}]#[fg=#101010,bg=#{?client_prefix,#eb6f92,#99ffe4}] #{?client_prefix,,}  #[fg=#{?client_prefix,#eb6f92,#99ffe4},bg=default]  "

# Inactive windows show only their number; the active window adds its title.
set-window-option -g window-status-style "fg=#a0a0a0,bg=default"
set-window-option -g window-status-format "#[fg=#a0a0a0] #I "
set-window-option -g window-status-current-style "fg=#ffc799,bg=default,bold"
set-window-option -g window-status-current-format "#[fg=#ffc799]#[fg=#101010,bg=#ffc799,bold]#{?window_zoomed_flag, ,}#W#[fg=#ffc799,bg=default,nobold]"

# Make ordinary text in inactive panes recede without altering application colors.
set-window-option -g window-style "fg=#5a5a5a,bg=#101010"
set-window-option -g window-active-style "fg=#e0e0e0,bg=#101010"
