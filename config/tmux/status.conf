# Vesper status bar with a transparent row and rounded window pills.
set-option -g status-position top
set-option -g status 2
set-option -g status-style "bg=default,fg=#a0a0a0"
set-option -g 'status-format[1]' ""
set-option -g status-left-length 8
set-option -g status-right-length 0
set-option -g status-right ""
set-option -g window-status-separator " "

# Mint while idle; love while the prefix is active.
set-option -g status-left "#[fg=#{?client_prefix,#eb6f92,#99ffe4}]#[fg=#101010,bg=#{?client_prefix,#eb6f92,#99ffe4}] #{?client_prefix,,}  #[fg=#{?client_prefix,#eb6f92,#99ffe4},bg=default]  "

# Inactive windows show only their number; the active window adds its title.
set-window-option -g window-status-style "fg=#7e7e7e,bg=default"
set-window-option -g window-status-format "#[fg=#7e7e7e]#[fg=#101010,bg=#7e7e7e] #I #[fg=#7e7e7e,bg=default]"
set-window-option -g window-status-current-style "fg=#ffc799,bg=default,bold"
set-window-option -g window-status-current-format "#[fg=#ffc799]#[fg=#101010,bg=#ffc799,bold]#I #W#[fg=#ffc799,bg=default,nobold]"
