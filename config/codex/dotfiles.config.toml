#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-terra"
model_reasoning_effort = "high"

[features]
hooks = true

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "run-state",
  "context-used",
]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 2
