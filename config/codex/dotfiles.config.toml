#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6.1-sol"
model_reasoning_effort = "low"
service_tier = "default"

[features]
hooks = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "run-state", "context-remaining", "five-hour-limit", "thread-name", "git-branch"]
status_line_use_colors = true
