# Managed Voxtype configuration for the Fedora/niri laptop.
# Linked to ~/.config/voxtype/config.toml by the voxtype setup phase.
# Models, temporary audio, meetings, and caches stay under XDG data/cache
# paths and are never committed to this repository.

# Local Whisper is the only default engine. Remote transcription requires an
# explicit documented config change and is intentionally left disabled.
engine = "whisper"
state_file = "auto"

[hotkey]
# niri owns Hyper+S (toggle). Voxtype observes Escape through evdev so it can
# cancel only while recording or transcribing without making Escape a global
# compositor binding. The setup phase manages the required input-group access.
enabled = true
# Recording is intentionally not assigned to an evdev key. Scroll Lock remains
# an unused fallback while the compositor owns the real toggle binding.
key = "SCROLLLOCK"
cancel_key = "ESC"
modifiers = []
mode = "toggle"

[audio]
device = "default"
sample_rate = 16000
# Voxtype always enforces a positive safety ceiling (default 60; 0 stops almost
# immediately). Use a day-long cap so ordinary dictation is effectively unlimited.
max_duration_secs = 86400

[audio.feedback]
enabled = true
theme = "subtle"
volume = 0.5

[whisper]
mode = "local"
model = "base.en"
language = "en"
translate = false
# Keep the model resident while the daemon runs so short dictations stay snappy
# on the laptop CPU. Use on_demand_loading = true if memory pressure is high.
on_demand_loading = false

[output]
# Prefer direct Wayland insertion through wtype. Clipboard remains the fallback
# only when typing fails; existing clipboard content is left alone on success.
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0
pre_type_delay_ms = 50

[output.notification]
# Start/stop notifications are replaced by the floating waveform OSD below.
on_recording_start = false
on_recording_stop = false
# Do not put dictated text into notifications.
on_transcription = false

[osd]
# Floating waveform shown while recording, replacing the start/stop
# notifications. Activates automatically when recording; no compositor
# binding needed. Requires the pinned voxtype-osd-gtk4 frontend binary.
enabled = true
frontend = "gtk4"
# position = "bottom-center"   # default; centered above the bar
# width = 400
# height = 48
